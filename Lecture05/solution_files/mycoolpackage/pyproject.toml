[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "mycoolpackage"
version = "0.1.0"
description = "Simple numerical operations on NumPy arrays"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "A. Student", email = "a.student@imperial.ac.uk" }]
dependencies = ["numpy>=1.21"]

[project.optional-dependencies]
dev = ["pytest", "flake8"]
